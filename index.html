<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f6d7c6">
  <title>Feliz cumpleaños</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎂%3C/text%3E%3C/svg%3E">
  <style>
    @font-face {
      font-family: "Fraunces";
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("assets/fonts/fraunces-latin.woff2") format("woff2");
    }

    @font-face {
      font-family: "Outfit";
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("assets/fonts/outfit-latin.woff2") format("woff2");
    }

    :root {
      color-scheme: light;
      --ink: #3a2924;
      --berry: #9d3048;
      --cocoa: #6a3e32;
      --paper: #fffaf6;
      --cream: #fff3e8;
      --line: #e0b08a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      color: var(--ink);
      font-family: Outfit, "Segoe UI", sans-serif;
      background: #f6d7c6;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }

    .pattern,
    .wash {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .pattern {
      background-image: url("assets/fondo.jpg");
      background-size: 540px auto;
      opacity: 0.28;
      animation: deriva 48s linear infinite;
    }

    .wash {
      background:
        radial-gradient(900px 520px at 8% -10%, rgba(255, 255, 255, 0.78), transparent 60%),
        radial-gradient(640px 480px at 100% 110%, rgba(224, 122, 141, 0.28), transparent 55%),
        linear-gradient(180deg, rgba(255, 236, 226, 0.55), rgba(246, 215, 198, 0.15));
    }

    .confetti {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 4;
    }

    .confetti i {
      position: absolute;
      top: -18px;
      display: block;
      opacity: 0.92;
      animation: caer linear infinite;
    }

    .confetti i.estallido {
      top: 34%;
      left: 50%;
      opacity: 1;
      animation: estallar 1.35s ease-out forwards;
    }

    main {
      position: relative;
      z-index: 3;
      width: 100%;
      min-width: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(28px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }

    .tarjeta {
      position: relative;
      width: min(440px, calc(100vw - 32px));
      min-width: 0;
      max-width: calc(100vw - 32px);
      background: var(--paper);
      border-radius: 30px;
      padding: 0 22px 26px;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.8) inset,
        0 22px 50px rgba(92, 42, 36, 0.16);
      animation: subir 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .globo {
      position: absolute;
      z-index: 5;
      pointer-events: none;
      border-radius: 50% 50% 48% 52% / 58% 58% 42% 42%;
      box-shadow: inset -7px -8px 0 rgba(255, 255, 255, 0.28);
      animation: flotar 4.8s ease-in-out infinite;
    }

    .globo::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 96%;
      width: 1.5px;
      height: 42px;
      background: rgba(90, 52, 42, 0.35);
    }

    .g1 { width: 48px; height: 60px; top: -22px; left: 18px; background: #e07a8d; }
    .g2 { width: 36px; height: 46px; top: -30px; right: 54px; background: #f2c14e; animation-delay: -1.6s; }
    .g3 { width: 30px; height: 38px; top: 8px; right: -8px; background: #7eaa8a; animation-delay: -2.8s; }

    .cinta {
      height: 12px;
      margin: 0 -22px 8px;
      border-radius: 30px 30px 0 0;
      background: repeating-linear-gradient(
        90deg,
        #b8435a 0 16px,
        #f2c14e 16px 26px,
        #fffaf6 26px 34px
      );
      background-size: 68px 100%;
      animation: cinta 7s linear infinite;
    }

    .marco {
      position: relative;
      animation: pop 0.75s cubic-bezier(0.2, 0.85, 0.2, 1.15) 0.15s both;
    }

    .estrella {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #f2c14e;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      animation: titilar 1.7s ease-in-out infinite;
    }

    .estrella:nth-child(1) { top: 6%; left: 4%; }
    .estrella:nth-child(2) { top: 18%; right: 2%; animation-delay: -0.4s; background: #e07a8d; }
    .estrella:nth-child(3) { top: 42%; left: 0; animation-delay: -0.9s; width: 7px; height: 7px; }
    .estrella:nth-child(4) { bottom: 18%; right: 6%; animation-delay: -1.2s; background: #7eaa8a; }
    .estrella:nth-child(5) { top: 2%; left: 46%; animation-delay: -0.6s; width: 8px; height: 8px; }

    .ilustracion {
      display: block;
      width: 100%;
      max-width: 340px;
      height: auto;
      margin: 0 auto;
      mix-blend-mode: multiply;
      animation: flotar-suave 4.6s ease-in-out 1s infinite;
    }

    .mensaje,
    .deseo,
    .cierre {
      animation: aparecer 0.7s ease both;
    }

    .mensaje {
      margin: 4px 0 0;
      font-family: Fraunces, Palatino, Georgia, serif;
      font-weight: 560;
      font-optical-sizing: auto;
      font-size: clamp(1.18rem, 4.6vw, 1.38rem);
      line-height: 1.5;
      letter-spacing: -0.015em;
      text-align: center;
      text-wrap: wrap;
      white-space: normal;
      overflow-wrap: break-word;
      max-width: 100%;
      animation-delay: 0.45s;
    }

    .deseo {
      margin: 18px 0 0;
      font-family: Fraunces, Palatino, Georgia, serif;
      font-weight: 650;
      font-optical-sizing: auto;
      font-size: clamp(1.28rem, 4.8vw, 1.55rem);
      line-height: 1.25;
      letter-spacing: -0.02em;
      text-align: center;
      text-wrap: wrap;
      white-space: normal;
      max-width: 100%;
      color: var(--berry);
      animation-delay: 0.75s;
    }

    .cierre {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      min-width: 0;
      animation-delay: 1s;
    }

    .pollito {
      width: 112px;
      height: auto;
      flex: none;
      margin-bottom: -8px;
      mix-blend-mode: multiply;
      transform-origin: 50% 90%;
      animation: saludo 2.6s ease-in-out 1.15s infinite;
    }

    .regalo {
      flex: 1;
      min-width: 0;
      margin: 0;
      padding: 14px 14px 15px;
      background: var(--cream);
      border: 1.5px dashed var(--line);
      border-radius: 18px;
      color: var(--cocoa);
      font-weight: 560;
      font-size: 1.02rem;
      line-height: 1.4;
      text-align: center;
      text-wrap: pretty;
      animation: latido 2.8s ease-in-out 1.6s infinite;
    }

    .envio {
      margin-top: 18px;
      animation: aparecer 0.7s ease 1.2s both;
    }

    .estado {
      margin: 0 0 8px;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 650;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--berry);
    }

    .puntos i {
      display: inline-block;
      width: 4px;
      height: 4px;
      margin-left: 3px;
      border-radius: 50%;
      background: currentColor;
      vertical-align: middle;
      animation: punto 1.2s ease-in-out infinite;
    }

    .puntos i:nth-child(2) { animation-delay: 0.15s; }
    .puntos i:nth-child(3) { animation-delay: 0.3s; }

    .pista {
      position: relative;
      height: 112px;
      overflow: hidden;
      border-radius: 18px;
      background:
        linear-gradient(#fff6ee, #fff6ee) center 78px / 100% 16px no-repeat,
        #fffaf6;
      border: 1.5px dashed var(--line);
    }

    .camino {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 26px;
      height: 4px;
      background: repeating-linear-gradient(90deg, #e0b08a 0 12px, transparent 12px 24px);
      animation: avanzar 0.7s linear infinite;
    }

    .meta {
      position: absolute;
      right: 14px;
      bottom: 30px;
      width: 16px;
      height: 16px;
      background: #b8435a;
      border: 2px solid #3a2924;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
    }

    .viajero {
      position: absolute;
      bottom: 20px;
      width: 78px;
      height: 72px;
      overflow: hidden;
      animation: recorrer 7.5s linear infinite;
    }

    .repartidor {
      width: 118px;
      height: 118px;
      margin: -24px 0 0 -20px;
      object-fit: cover;
      mix-blend-mode: multiply;
      animation: brinco 0.42s ease-in-out infinite;
    }

    @keyframes subir {
      from { opacity: 0; transform: translateY(28px) scale(0.94); }
      to { opacity: 1; transform: none; }
    }

    @keyframes pop {
      0% { opacity: 0; transform: translateY(12px) scale(0.86); }
      70% { opacity: 1; transform: translateY(-4px) scale(1.03); }
      100% { opacity: 1; transform: none; }
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes caer {
      to { transform: translateY(110dvh) rotate(320deg); }
    }

    @keyframes estallar {
      to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; }
    }

    @keyframes saludo {
      0%, 100% { transform: translateY(0) rotate(0); }
      18% { transform: translateY(-16px) rotate(-7deg); }
      34% { transform: translateY(0) rotate(3deg) scale(1.05, 0.94); }
      48% { transform: translateY(-8px) rotate(5deg); }
      64% { transform: translateY(0) rotate(0); }
    }

    @keyframes flotar {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-12px) rotate(5deg); }
    }

    @keyframes flotar-suave {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes titilar {
      0%, 100% { opacity: 0.25; transform: scale(0.7) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.15) rotate(18deg); }
    }

    @keyframes cinta {
      to { background-position: 68px 0; }
    }

    @keyframes deriva {
      to { background-position: 80px 140px; }
    }

    @keyframes latido {
      0%, 100% { box-shadow: 0 0 0 0 rgba(242, 193, 78, 0); }
      50% { box-shadow: 0 0 0 5px rgba(242, 193, 78, 0.28); }
    }

    @keyframes recorrer {
      from { left: -90px; }
      to { left: calc(100% - 64px); }
    }

    @keyframes brinco {
      0%, 100% { transform: scaleX(-1) translateY(0); }
      50% { transform: scaleX(-1) translateY(-5px); }
    }

    @keyframes avanzar {
      to { background-position: -24px 0; }
    }

    @keyframes punto {
      0%, 70%, 100% { opacity: 0.25; transform: translateY(0); }
      35% { opacity: 1; transform: translateY(-3px); }
    }

    @media (max-width: 520px) {
      .tarjeta { padding: 0 16px 22px; }
      .cinta { margin: 0 -16px 4px; }
      .cierre { flex-direction: column; align-items: center; }
      .pollito { width: 120px; margin-bottom: 0; }
      .regalo { width: 100%; }
      .g3 { right: 4px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .confetti, .estrella { display: none; }
      .pattern,
      .tarjeta,
      .marco,
      .ilustracion,
      .mensaje,
      .deseo,
      .cierre,
      .pollito,
      .regalo,
      .globo,
      .cinta,
      .envio,
      .viajero,
      .repartidor,
      .camino,
      .puntos i {
        animation: none;
        opacity: 1;
        transform: none;
      }

      .viajero { left: 12px; }
      .repartidor { transform: scaleX(-1); }
    }
  </style>
</head>
<body>
  <div class="pattern" aria-hidden="true"></div>
  <div class="wash" aria-hidden="true"></div>
  <div class="confetti" aria-hidden="true"></div>

  <main>
    <article class="tarjeta">
      <span class="globo g1" aria-hidden="true"></span>
      <span class="globo g2" aria-hidden="true"></span>
      <span class="globo g3" aria-hidden="true"></span>
      <div class="cinta" aria-hidden="true"></div>
      <div class="marco">
        <i class="estrella" aria-hidden="true"></i>
        <i class="estrella" aria-hidden="true"></i>
        <i class="estrella" aria-hidden="true"></i>
        <i class="estrella" aria-hidden="true"></i>
        <i class="estrella" aria-hidden="true"></i>
        <img class="ilustracion" src="assets/pastel.png" alt="Pastel con velas y las palabras feliz cumpleaños">
      </div>
      <p class="mensaje">Los postres no tardan de 6 a 10 días hábiles en llegar, así que pudieron entregarse a tiempo para desearte un feliz cumpleaños.</p>
      <p class="deseo">¡Que tengas un excelente día! 🎉</p>
      <div class="cierre">
        <img class="pollito" src="assets/pollito.png" alt="Pollito con gorro de fiesta">
        <p class="regalo">El regalo principal llega en unos días.</p>
      </div>
      <section class="envio" aria-label="El paquete va en camino">
        <p class="estado">En camino<span class="puntos" aria-hidden="true"><i></i><i></i><i></i></span></p>
        <div class="pista">
          <div class="camino" aria-hidden="true"></div>
          <span class="meta" aria-hidden="true"></span>
          <div class="viajero">
            <img class="repartidor" src="assets/pollito-repartidor.jpg" alt="Pollito repartidor llevando un paquete">
          </div>
        </div>
      </section>
    </article>
  </main>
  <script>
    (function () {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      var capa = document.querySelector(".confetti");
      var colores = ["#e07a8d", "#f2c14e", "#7eaa8a", "#fffaf6", "#c47a55", "#b8435a"];

      function pieza(indice) {
        var p = document.createElement("i");
        p.style.background = colores[indice % colores.length];
        if (indice % 3 === 0) {
          p.style.width = "8px";
          p.style.height = "8px";
          p.style.borderRadius = "50%";
        } else if (indice % 3 === 1) {
          p.style.width = "7px";
          p.style.height = "13px";
          p.style.borderRadius = "2px";
        } else {
          p.style.width = "11px";
          p.style.height = "6px";
          p.style.borderRadius = "2px";
        }
        return p;
      }

      for (var i = 0; i < 30; i++) {
        var copo = pieza(i);
        copo.style.left = Math.random() * 100 + "%";
        copo.style.animationDuration = (6 + Math.random() * 7) + "s";
        copo.style.animationDelay = (-Math.random() * 10) + "s";
        capa.appendChild(copo);
      }

      for (var j = 0; j < 22; j++) {
        var estallido = pieza(j + 3);
        estallido.className = "estallido";
        estallido.style.setProperty("--x", (Math.random() * 280 - 140) + "px");
        estallido.style.setProperty("--y", (Math.random() * 220 - 30) + "px");
        estallido.style.setProperty("--r", (Math.random() * 360) + "deg");
        estallido.style.animationDelay = (Math.random() * 0.2) + "s";
        capa.appendChild(estallido);
      }
    })();
  </script>
</body>
</html>
